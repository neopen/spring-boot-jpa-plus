name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Generate Javadoc
        run: mvn -B -q javadoc:aggregate -DskipTests -Dmaven.javadoc.failOnError=false

      - name: Attach Javadoc
        run: |
          JAVADOC_DIR=$(find . -type d -name apidocs -path '*/target/*' | head -n 1)
          if [ -z "$JAVADOC_DIR" ]; then
            echo "Javadoc output not found, skipping"
            exit 0
          fi
          mkdir -p docs/.vitepress/dist/api
          cp -r "$JAVADOC_DIR"/. docs/.vitepress/dist/api/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
