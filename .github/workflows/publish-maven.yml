name: Publish Maven Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. 导入 GPG 私钥（用于 Maven Central 签名）
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is missing"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      # 4. 动态配置 Maven 的 settings.xml（写入 Sonatype 和 GitHub 凭证）
      - name: Configure Maven Settings
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          required = ["CENTRAL_USERNAME", "CENTRAL_PASSWORD", "GITHUB_TOKEN", "GITHUB_ACTOR"]
          for key in required:
              if not os.environ.get(key):
                  raise RuntimeError(f"Required environment variable {key} is missing")

          settings = ET.Element("settings")
          servers = ET.SubElement(settings, "servers")

          credentials = [
              ("central", os.environ["CENTRAL_USERNAME"], os.environ["CENTRAL_PASSWORD"]),
              ("github", os.environ["GITHUB_ACTOR"], os.environ["GITHUB_TOKEN"]),
          ]

          for server_id, username, password in credentials:
              server = ET.SubElement(servers, "server")
              ET.SubElement(server, "id").text = server_id
              ET.SubElement(server, "username").text = username
              ET.SubElement(server, "password").text = password

          ET.indent(settings, space="  ")
          ET.ElementTree(settings).write(
              os.path.expanduser("~/.m2/settings.xml"),
              encoding="utf-8",
              xml_declaration=True,
          )
          print("Maven settings.xml configured successfully.")
          PY

      # 5. 根据 Git Tag 自动修改项目版本号
      - name: Verify version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          mvn -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      # 6. 本地编译与测试（跳过签名以加快测试）
      - name: Test
        run: |
          mvn -B -ntp clean verify \
            -DskipTests=false \
            -Dgpg.skip=true

      # 7. 发布到 Maven Central (使用 pom.xml 中的 central profile)
      - name: Publish to Maven Central
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$MAVEN_GPG_PASSPHRASE" ]; then
            echo "::error::GPG_PASSPHRASE is missing"
            exit 1
          fi
          mvn -B -ntp deploy -Pcentral \
            -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" \
            -DskipTests

      # 8. 发布到 GitHub Packages (使用 distributionManagement 中指定的仓库)
      - name: Publish to GitHub Packages
        run: |
          mvn -B -ntp deploy \
            -DskipTests \
            -Dgpg.skip=true

      # 9. 创建 GitHub Release 并自动生成更新日志
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true