name: Compatibility

on:
  push:
    branches: [ dev, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK ${{ matrix.java }} / Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 限制并发，避免多个组合同时下载依赖触发 Maven Central 429
      max-parallel: 2
      matrix:
        include:
          - java: 17
            boot: 3.4.13
          - java: 21
            boot: 3.4.13
          - java: 17
            boot: 3.2.12
          - java: 17
            boot: 3.3.5
          - java: 17
            boot: 3.5.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # 覆盖 CI 构建缓存的 Spring Boot 版本，执行全量 verify。
      # 运行器自带 Docker，MySQL / PostgreSQL 的 Testcontainers 用例会真实执行。
      # 重试参数用于缓解 Maven Central 偶发 429。
      - name: Verify
        run: >
          mvn -B -ntp verify -Dgpg.skip=true
          -Dspring-boot.version=${{ matrix.boot }}
          -Dmaven.wagon.http.retryHandler.count=5
          -Daether.connector.http.retryHandler.count=5
