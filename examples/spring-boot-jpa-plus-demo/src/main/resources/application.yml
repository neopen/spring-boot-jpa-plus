server:
  port: 8080

spring:
  application:
    name: jpa-plus-demo
  main:
    allow-bean-definition-overriding: true
  #
  aop:
    proxy-target-class: true
#
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  #
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  # 使用 http://localhost:8080/h2/login.do 登录，输入：jdbc:h2:mem:orderdb
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        trace: false
        web-allow-others: false

logging:
  level:
    root: warn
    io.github.neopen: info
    org.apache.kafka: info
    org.springframework.kafka: warn

neopen:
  jpa:
    encryption:
      # 演示字段加密，生产环境必须替换并通过环境变量注入
      key: demo-encryption-key
    slow-sql:
      enabled: true
      threshold-ms: 500
    # 0.7：自动开启 Hibernate JDBC 批量
    jdbc-batch:
      enabled: true
      batch-size: 50
    # 0.7：统计数据源路由与慢 SQL，需类路径存在 Micrometer
    metrics:
      enabled: true
      slow-threshold-ms: 500
    scopes:
      # 归档查询作用域：只影响绑定该作用域的线程，其他查询仍过滤已删除数据
      archive-view:
        logic-delete-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakerevents
  endpoint:
    health:
      show-details: always

